[project]
name = "langrapph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ebohfrankline-bot", email = "ebohfrankline@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.4",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
langrapph = "langrapph:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
